# nginx/nginx.conf
#
# Task 39.3/39.4. Two jobs in one server block: serve the built React
# SPA (with client-side-routing fallback to index.html), and reverse
# proxy /api/* to the `api` service by its Docker Compose service name
# (Compose's embedded DNS resolves `api` to the right container — no
# hardcoded IPs).
#
# SSE note (Task 26): /api/sse/stream is proxied separately from the
# general /api/ block, with proxy_buffering off and a long
# proxy_read_timeout. Nginx buffers proxied responses by default,
# which would hold open SSE events in a buffer instead of flushing
# them to the browser as they arrive — silently breaking the "live"
# dashboard updates this route exists for, without any visible error.
# This is exactly the same class of silent-hang failure documented in
# config/redis.js's Task 26 bug-fix comment, just at the Nginx layer
# instead of the Redis layer — worth remembering if live updates work
# in dev (no Nginx in front) but stop working once this proxy is
# introduced.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — any path that isn't a real static file or /api/*
    # falls through to index.html, letting react-router handle it
    # client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE — must be defined BEFORE the general /api/ block below so
    # this more specific location wins (Nginx matches the longest/most
    # specific prefix location, but keeping proxy-buffering-sensitive
    # routes visually separate and first avoids ambiguity later if
    # this file grows more routes).
    location /api/sse/ {
        proxy_pass http://api:5000/api/sse/;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE connections are long-lived by design — the default 60s
        # read timeout would kill an idle-but-still-open stream.
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}