<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faultline - Developer Observability Platform</title>
    <link rel="preload" href="/fonts/NeueHaasDisplayRoman.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/fonts/NeueHaasDisplayMediu.ttf" as="font" type="font/ttf" crossorigin>
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('faultline_theme');
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('light');
                }
            } catch (e) {}
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
